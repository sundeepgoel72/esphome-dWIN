substitutions:
  name: dwin-test
  tx_pin: GPIO17
  rx_pin: GPIO16

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} Fallback
    password: "dwin12345"

external_components:
  - source:
      type: git
      url: https://github.com/sundeepgoel72/esphome-dWIN
      ref: dev
    components: [dwin]

uart:
  id: dwin_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 115200
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      bytes: 32
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

display:
  - platform: dwin
    id: panel
    update_interval: 2s
    command_spacing: 10ms
    max_queue_size: 32
    brightness: 75%
    lambda: |-
      static uint16_t counter = 0;
      it.set_text(0x1000, "ESPHome DWIN", 24);
      it.set_word(0x1100, counter++);
      it.request_words(0x2000, 2);
    on_vp_data:
      then:
        - lambda: |-
            ESP_LOGI("dwin_test", "VP 0x%04X returned %u words", vp, data.size());
    on_register_data:
      then:
        - lambda: |-
            ESP_LOGI("dwin_test", "Register 0x%02X returned %u bytes", address, data.size());
    on_buffer_overflow:
      then:
        - lambda: |-
            ESP_LOGW("dwin_test", "DWIN command queue overflow");

button:
  - platform: template
    name: ${name} Page 0
    on_press:
      - display.dwin.set_page:
          id: panel
          page: 0
  - platform: template
    name: ${name} Page 1
    on_press:
      - display.dwin.set_page:
          id: panel
          page: 1
  - platform: template
    name: ${name} Brightness 50
    on_press:
      - display.dwin.set_brightness:
          id: panel
          brightness: 50%
  - platform: template
    name: ${name} Write Test Text
    on_press:
      - display.dwin.write_text:
          id: panel
          address: 0x1000
          text: "Button Press"
          length: 24
      - display.dwin.write_word:
          id: panel
          address: 0x1100
          value: 1234
