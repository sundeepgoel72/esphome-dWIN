esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: dwin_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

display:
  - platform: dwin
    id: dwin_display
    update_interval: 1s
    brightness: 75%
    command_spacing: 10ms
    max_queue_size: 16
    brightness_address: 0x0082
    page_address: 0x0084
    lambda: |-
      it.set_text(0x1000, "ESPHome", 16);
      it.set_word(0x1100, 42);
      it.request_words(0x2000, 2);
    on_vp_data:
      then:
        - lambda: |-
            ESP_LOGI("dwin", "VP 0x%04X words=%u", vp, data.size());
    on_register_data:
      then:
        - lambda: |-
            ESP_LOGI("dwin", "Register 0x%02X bytes=%u", address, data.size());
    on_buffer_overflow:
      then:
        - lambda: |-
            ESP_LOGW("dwin", "DWIN queue overflow");

button:
  - platform: template
    name: DWIN Page 1
    on_press:
      - display.dwin.set_page:
          id: dwin_display
          page: 1
      - display.dwin.set_brightness:
          id: dwin_display
          brightness: 50%
      - display.dwin.write_word:
          id: dwin_display
          address: 0x1100
          value: 123
      - display.dwin.write_text:
          id: dwin_display
          address: 0x1000
          text: "Hello"
          length: 16
      - display.dwin.read_vp:
          id: dwin_display
          address: 0x2000
          words: 2
